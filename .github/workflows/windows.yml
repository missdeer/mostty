name: Windows build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      gui:
        description: Run GUI suites on the existing runner named by MOSTTY_WINDOWS_GUI_RUNNER
        type: boolean
        default: false

permissions:
  contents: read
env:
  ZIG_GLOBAL_CACHE_DIR: .zig-cache
  MOSTTY_CONPTY_VERSION: 1.25.261109001

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conpty:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Microsoft ConPTY
        shell: powershell
        run: |
          if (-not $env:MOSTTY_CONPTY_VERSION) { throw 'Pinned Microsoft ConPTY version missing' }
          & ./tools/download-conpty.ps1 -Version $env:MOSTTY_CONPTY_VERSION -Destination ./conpty

      - name: Check latest stable downloader and existing-directory update
        shell: powershell
        run: |
          & ./tools/download-conpty.ps1 -Destination ./tmp/conpty-latest
          $version = (Get-Content ./tmp/conpty-latest/manifest.json -Raw | ConvertFrom-Json).version
          Set-Content ./tmp/conpty-latest/keep.txt 'preserve-existing-files'
          & ./tools/download-conpty.ps1 -Version $version -Destination './tmp/conpty-latest/'
          if ((Get-Content ./tmp/conpty-latest/keep.txt -Raw).Trim() -ne 'preserve-existing-files') {
            throw 'Updating ConPTY lost an existing file'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: conpty-windows-x64
          path: conpty/
          if-no-files-found: error

  build:
    needs: conpty
    runs-on: ${{ inputs.gui && vars.MOSTTY_WINDOWS_GUI_RUNNER || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
        cpu: [baseline, x86_64_v2, x86_64_v3]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install shader toolchain
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            winget install --source winget --id KhronosGroup.VulkanSDK --version 1.4.350.0 --exact --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Vulkan SDK installation attempt $attempt failed with exit code $LASTEXITCODE"
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw 'Vulkan SDK installation failed after three attempts'

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }} -Dcpu=${{ matrix.cpu }}

      - name: Run unit tests
        run: zig build test -Doptimize=${{ matrix.optimize }} -Dcpu=${{ matrix.cpu }} --summary all

      - name: Run acceptance inventory
        if: matrix.optimize == 'Debug' && matrix.cpu == 'baseline'
        shell: pwsh
        run: |
          & tools/ci-tests.ps1 -Gui:('${{ inputs.gui && vars.MOSTTY_WINDOWS_GUI_RUNNER != '' }}' -eq 'true')

      - name: Preserve test evidence
        if: always() && matrix.optimize == 'Debug' && matrix.cpu == 'baseline'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: tmp/

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item zig-out/bin/Mostty.exe dist/
          if (Test-Path zig-out/bin/Mostty.pdb) { Copy-Item zig-out/bin/Mostty.pdb dist/ }
          Copy-Item zig-out/bin/themes dist/themes -Recurse
          Copy-Item zig-out/share dist/share -Recurse
          @{ commit=(& git rev-parse HEAD); compiler=(& zig version); mode='${{ matrix.optimize }}'; target_cpu='${{ matrix.cpu }}'; dependency_manifest_sha256=(Get-FileHash build.zig.zon -Algorithm SHA256).Hash; conpty_version=$env:MOSTTY_CONPTY_VERSION } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist/build-metadata.json

      - uses: actions/download-artifact@v4
        with:
          name: conpty-windows-x64
          path: dist/conpty

      - uses: actions/upload-artifact@v4
        with:
          name: Mostty-windows-${{ matrix.cpu }}-${{ matrix.optimize }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Mostty-windows-*
          path: artifacts

      - name: Package release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path artifacts -Directory | ForEach-Object {
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath "release/$($_.Name).zip" -Force
          }

      - name: Generate changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $range = "$prev..$tag"
            $header = "## Changes since $prev"
          } else {
            $range = $tag
            $header = "## Changes"
          }
          $log = git log $range --no-merges --pretty='- %s (%h)'
          @($header, "") + $log | Out-File -Encoding utf8 release-notes.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # gh release create exits non-zero when the macOS workflow already
          # created the release for this tag; keep that from aborting the step
          # (pwsh 7.4 turns native non-zero exits into terminating errors under
          # the Actions default $ErrorActionPreference = 'Stop').
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem release/*.zip | ForEach-Object { $_.FullName }
          gh release create $tag --title $tag --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { Write-Host "Release $tag already exists; uploading assets" }
          gh release upload $tag $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets" }
