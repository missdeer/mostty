name: Runtime benchmarks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      BENCH_BASE: ${{ github.event.pull_request.base.sha || 'b128d906fc5ceee9446ae634a7a1d6d6a7baf2b1' }}
      BENCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: '26'
      - name: Install existing Windows shader toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            winget install --source winget --id KhronosGroup.VulkanSDK --version 1.4.350.0 --exact --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw 'Shader toolchain installation failed'
      - name: Compare on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/bench/run.sh
      - name: Compare on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/bench/run.ps1
      - name: Native Windows memory collector smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/memory/fixture.ps1 -Case cjk-cold -Output tmp/runtime-bench/memory-fixture.bin
          ./tests/memory/fixture.ps1 -Case wallpaper-control -Output tmp/runtime-bench/memory-fixture-wallpaper.bin
          ./tests/memory/collect.ps1 -Smoke -Output tmp/runtime-bench/memory-smoke.jsonl -Samples 2 -IntervalMs 50
      - name: Native macOS memory collector smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          swiftc tests/memory/collect.swift -framework AppKit -framework Metal -o tmp/runtime-bench/memory-collect
          tmp/runtime-bench/memory-collect --smoke tmp/runtime-bench/memory-smoke.jsonl
          swiftc tests/memory/fixture.swift -o tmp/runtime-bench/memory-fixture
          tmp/runtime-bench/memory-fixture tests/memory/workloads.json cjk-cold tmp/runtime-bench/memory-fixture.bin
          tmp/runtime-bench/memory-fixture tests/memory/workloads.json wallpaper-control tmp/runtime-bench/memory-fixture-wallpaper.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-bench-${{ runner.os }}
          path: |
            tmp/runtime-bench/*.log
            tmp/runtime-bench/metadata.json
            tmp/runtime-bench/memory-smoke.jsonl
            tmp/runtime-bench/memory-fixture*.json
          if-no-files-found: error
  report:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-bench-*
          path: tmp/benchmark-artifacts
      - name: Validate mechanisms and report every workload
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/bench -p 'test_*.py'
          python3 tests/bench/report.py tmp/benchmark-artifacts tmp/benchmark-report | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -m unittest discover -s tests/memory -p 'test_*.py'
          python3 tests/memory/report.py tmp/benchmark-artifacts tmp/benchmark-report/memory --require-native-smoke | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-bench-comparison
          path: tmp/benchmark-report/
